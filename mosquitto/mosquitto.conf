# ================================================================
#  Eclipse Mosquitto Configuration for Petroleum Pump IoT
#  File: /etc/mosquitto/conf.d/petroleum-iot.conf
# ================================================================

# Standard MQTT Port for Hardware Devices (ESP32, Arduino, GSM Modems)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket Port for Web Dashboard (Optional direct browser connectivity)
listener 9001 0.0.0.0
protocol websockets

# Persistence & Storage
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 1800

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Security / Rate limits
max_connections -1
max_queued_messages 1000
