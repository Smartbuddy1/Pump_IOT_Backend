# ================================================================
#  AWS EC2 - NGINX CONFIGURATION
#  Server IP: 13.232.110.133
#  File: /etc/nginx/sites-available/petroleum-iot
# ================================================================

server {
    listen 80;
    server_name 13.232.110.133;

    # ── Frontend (React build files) ──────────────────────────
    root /home/ubuntu/petroleum-iot/frontend/dist;
    index index.html;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect root / to /p2t/
    location = / {
        return 301 /p2t/;
    }

    # Handle /p2t/ subpath and assets
    location ^~ /p2t/ {
        alias /home/ubuntu/petroleum-iot/frontend/dist/;
        try_files $uri $uri/ /p2t/index.html;
    }

    # Handle direct access fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API Proxy ─────────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Socket.IO WebSocket Proxy ─────────────────────────────
    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Static file caching ───────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
